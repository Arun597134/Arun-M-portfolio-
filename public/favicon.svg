<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#141424"/>
    </linearGradient>
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <!-- Monogram Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Background (Squircle for adaptive app icon layouts) -->
  <rect width="480" height="480" x="16" y="16" rx="96" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" filter="url(#neonGlow)"/>

  <!-- Styled Cybernetic Monogram "A" -->
  <g transform="translate(112, 100)">
    <!-- Left Leg -->
    <path d="M 60 280 L 120 70 L 160 70 L 100 280 Z" fill="url(#logoGrad)"/>
    <!-- Right Leg -->
    <path d="M 228 280 L 168 70 L 128 70 L 188 280 Z" fill="url(#logoGrad)" opacity="0.85"/>
    
    <!-- Crossbar: Glowing circuit track node -->
    <path d="M 90 200 L 198 200" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round" filter="url(#neonGlow)"/>
    <circle cx="144" cy="200" r="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="4" filter="url(#neonGlow)"/>
    
    <!-- Small tech circuit details -->
    <path d="M 120 70 L 168 70" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
    <circle cx="60" cy="280" r="6" fill="#8b5cf6"/>
    <circle cx="228" cy="280" r="6" fill="#8b5cf6"/>
  </g>

  <!-- Subtitle Monogram Label -->
  <text x="256" y="430" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" fill="#a5b4fc" letter-spacing="4" text-anchor="middle">ARUN M.</text>
</svg>